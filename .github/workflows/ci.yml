name: CI

on:
  push:
    branches:
      - v3
  pull_request:
    branches:
      - v3

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.1, 3.8, 3.9, 3.10]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install weasel pytest

      - name: Run tests
        run: |
          bash run-tests.sh python

      - name: Lint with flake8
        run: |
          pip install flake8
          # Exclude directories and files from linting
          flake8 . --exclude=venv,.venv,env,env.bak,venv.bak,__pycache__,build,dist,packages,training

      - name: Security check with safety
        run: |
          pip install safety
          safety check --full-report
