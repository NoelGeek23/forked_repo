name: CI

on:
  push:
    branches:
      - v3
  pull_request:
    branches:
      - v3

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests script for all projects
        run: |
          chmod +x run-tests.sh
          ./run-tests.sh python all

      - name: Lint with flake8
        run: |
          pip install flake8
          # Exclude tutorials and benchmarks to speed up linting
          flake8 . --exclude tutorials,benchmarks,experimental,integrations,pipelines

      - name: Security check with bandit
        run: |
          pip install bandit
          bandit -r . -x tutorials,benchmarks,experimental,integrations,pipelines

      - name: Build wheels for packaging
        run: |
          pip install wheel
          # Build wheels for all packages in tutorials and pipelines
          find tutorials pipelines -name "setup.py" -execdir python setup.py bdist_wheel \;

      - name: Upload test results (optional)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: .
